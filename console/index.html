<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>journal 控制台</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+TC:wght@400;500;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* ═══ tokens —— taskwire 設計稿 2026-08-28 拍板的色票，journal 跟進（2026-08-31）═══ */
:root{
	--bg:#f3f5f8; --panel:#fff; --ink:#12151a; --ink2:#5a6472;
	--line:#e2e6ec; --line2:#eef1f5; --acc:#3b5bdb; --acc-bg:#eaeeff;
	--ok:#0f7b41; --ok-bg:#e8f5ee; --bad:#b3261e; --bad-bg:#fdecea;
	--warn:#8a5a00; --warn-bg:#fdf3e0; --idle:#5a6472; --idle-bg:#eef1f5;
	--side:#161b26; --side-line:#232b3b; --side-txt:#9aa3b2; --side-dim:#6b7484;
	--mono:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
	--sans:-apple-system,BlinkMacSystemFont,'PingFang TC',Inter,'Noto Sans TC',sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);
	font-size:13.5px;line-height:1.6;-webkit-font-smoothing:antialiased}
a{color:var(--acc);text-decoration:none} a:hover{color:#2f49b0}
code{font-family:var(--mono);font-size:.9em;background:var(--line2);
	border-radius:4px;padding:1px 5px;overflow-wrap:anywhere}
code.hash{color:var(--acc);background:var(--acc-bg)}

/* ═══ 殼：側欄＋主區 ═══ */
.shell{display:flex;height:100vh;overflow:hidden}
.side{width:224px;flex:0 0 auto;background:var(--side);display:flex;
	flex-direction:column;padding:18px 14px}
.brand{display:flex;align-items:center;gap:9px;padding:2px 12px 16px}
.brand svg{color:#8aa2ff}
.brand .name{font-family:var(--mono);font-size:15px;font-weight:600;color:#fff;letter-spacing:-.01em}
.brand .sub{font-size:11px;color:var(--side-dim)}
.nav{display:flex;flex-direction:column;gap:3px}
.nav-item{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:8px;
	font-size:13px;font-weight:500;color:var(--side-txt);cursor:pointer;border:none;background:none;
	font-family:var(--sans);text-align:left;width:100%}
.nav-item svg{color:var(--side-dim);flex:0 0 auto}
.nav-item:hover{background:#1d2432;color:#d5dae2}
.nav-item.on{background:#262e40;color:#fff;font-weight:600}
.nav-item.on svg{color:#8aa2ff}
.side-foot{margin-top:auto;display:flex;flex-direction:column;gap:6px;
	padding:12px 12px 0;border-top:1px solid var(--side-line)}
.side-foot .row{font-size:12px;color:var(--side-txt)}
.side-foot .repo{font-family:var(--mono);font-size:10.5px;color:#5b6472;word-break:break-all}

.main{flex:1 1 auto;display:flex;flex-direction:column;min-width:0}
.topbar{flex:0 0 auto;display:flex;align-items:center;gap:14px;
	padding:14px 24px;background:var(--panel);border-bottom:1px solid var(--line)}
.topbar h1{font-size:17px;font-weight:800;letter-spacing:-.02em;margin:0}
.topbar .sub{font-size:12px;color:var(--ink2)}
.topbar .acts{margin-left:auto;display:flex;align-items:center;gap:8px}
.content{flex:1 1 auto;overflow:auto;padding:18px 24px 24px;
	display:flex;flex-direction:column;gap:14px;align-content:flex-start}

/* ═══ 元件 ═══ */
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px 18px}
.card-head{display:flex;align-items:flex-start;gap:8px;margin-bottom:12px}
.card-head .t{font-size:13.5px;font-weight:700}
.card-head .s{font-size:12px;color:var(--ink2)}
.card-head .right{margin-left:auto;display:flex;gap:8px;align-items:center}
.btn{background:var(--panel);border:1px solid #d5dae2;color:#3f4754;
	font-family:var(--sans);font-size:12.5px;font-weight:600;padding:7px 13px;
	border-radius:8px;cursor:pointer}
.btn:hover{border-color:var(--acc);color:var(--acc)}
.btn.primary{background:var(--acc);border-color:var(--acc);color:#fff}
.btn.primary:hover{opacity:.92;color:#fff}
.btn.danger{color:var(--bad)} .btn.danger:hover{border-color:var(--bad)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.badge{font-family:var(--mono);font-size:11px;font-weight:600;padding:2px 8px;
	border-radius:999px;white-space:nowrap}
.b-ok{color:var(--ok);background:var(--ok-bg)} .b-bad{color:var(--bad);background:var(--bad-bg)}
.b-warn{color:var(--warn);background:var(--warn-bg)} .b-idle{color:var(--idle);background:var(--idle-bg)}
.b-accent{color:var(--acc);background:var(--acc-bg)}
.dot{display:inline-block;width:8px;height:8px;border-radius:999px;flex:0 0 auto}
input,select{font-family:var(--mono);font-size:12.5px;padding:8px 11px;
	border:1px solid #d5dae2;border-radius:8px;background:#fafbfc;color:var(--ink)}
input:focus,select:focus{outline:2px solid var(--acc);outline-offset:-1px}
input[type=range]{padding:0;border:none;background:none;accent-color:var(--acc);width:190px;vertical-align:middle}
input[type=range]:focus{outline:none}

.err{background:var(--bad-bg);border:1px solid var(--bad);color:var(--bad);
	border-radius:8px;padding:11px 13px;font-size:12.5px}
.err pre{background:transparent;border:none;color:inherit;padding:6px 0 0;margin:0;
	white-space:pre-wrap;word-break:break-word;font-family:var(--mono);font-size:11.5px}
.okmsg{background:var(--ok-bg);border:1px solid var(--ok);color:var(--ok);
	border-radius:8px;padding:9px 12px;font-size:12.5px}
.muted{font-size:12px;color:var(--ink2)}
.mono{font-family:var(--mono)}
.empty{font-size:12.5px;color:#8892a0;padding:4px 0 2px}
.spin{display:inline-block;width:11px;height:11px;border:2px solid var(--line);
	border-top-color:var(--acc);border-radius:50%;animation:sp .7s linear infinite;vertical-align:-1px}
@keyframes sp{to{transform:rotate(360deg)}}
.loading{display:flex;align-items:center;gap:9px;color:var(--ink2);font-size:12.5px;padding:8px 2px}

/* 列（清單一律 grid row＋細分隔線，不用 table）*/
.arow{display:flex;gap:10px;align-items:baseline;padding:9px 0;border-bottom:1px solid var(--line2)}
.arow:last-child,.hrow:last-child,.lrow:last-child,.trrow:last-child{border-bottom:none}
.hrow{display:grid;grid-template-columns:16px 1fr auto;gap:10px;align-items:center;
	padding:9px 0;border-bottom:1px solid var(--line2)}
.hrow .nm{font-weight:600}
.hrow .meta{font-family:var(--mono);font-size:11px;color:var(--ink2);text-align:right}
.lrow{display:flex;gap:10px;align-items:baseline;padding:8px 0;border-bottom:1px solid var(--line2)}
.lrow .who{font-weight:600}
.ghead{display:flex;align-items:center;gap:8px;margin:14px 0 2px;font-size:13px;font-weight:700}
.ghead:first-child{margin-top:0}
.ghead .cnt{font-family:var(--mono);font-size:11px;font-weight:600;color:#8892a0}

/* 目標磚 */
.gtiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:10px;
	padding:14px 16px;display:flex;flex-direction:column;gap:6px}
.tile .lab{display:flex;justify-content:space-between;align-items:center;gap:8px}
.tile .id{font-family:var(--mono);font-size:13px;font-weight:600;overflow-wrap:anywhere}
.tile .ttl{font-size:12px;color:var(--ink2)}
.tile .meta{font-family:var(--mono);font-size:11px;color:#8892a0;overflow-wrap:anywhere}

/* 早會 */
.standup p{margin:5px 0;font-size:13.5px;display:flex;gap:8px;align-items:baseline}
.standup p .dot{margin-top:0;align-self:center}
.standup p.red{color:var(--bad)}

/* 日誌導覽與軸切換 */
.daynav{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
.daynav button{border:1px solid var(--line);background:var(--panel);border-radius:8px;
	padding:5px 12px;color:var(--ink2);font-family:var(--mono);font-size:11.5px;
	font-weight:600;white-space:nowrap;cursor:pointer}
.daynav button:hover{border-color:var(--acc);color:var(--acc)}
.daynav button.on{background:var(--acc-bg);border-color:var(--acc);color:var(--acc)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;
	overflow:hidden;background:var(--panel)}
.seg button{border:none;background:none;font-family:var(--sans);font-size:11.5px;
	font-weight:600;padding:4px 11px;color:var(--ink2);cursor:pointer}
.seg button + button{border-left:1px solid var(--line)}
.seg button.on{background:var(--acc-bg);color:var(--acc)}
details.raw > summary{cursor:pointer;list-style:none;display:inline-block;
	font-size:12.5px;font-weight:600;color:var(--ink2);border:1px solid #d5dae2;
	border-radius:8px;padding:6px 13px;user-select:none;background:var(--panel)}
details.raw > summary:hover{border-color:var(--acc);color:var(--acc)}
details.raw > summary::before{content:'▸ ';color:#8892a0}
details.raw[open] > summary::before{content:'▾ '}
details.raw[open] > summary{margin-bottom:10px}

/* 旋鈕 */
.knob{display:grid;grid-template-columns:190px 1fr;gap:4px 16px;align-items:center;
	padding:12px 0;border-bottom:1px solid var(--line2)}
.knob:last-child{border-bottom:none}
.knob .kname{font-family:var(--mono);font-size:12px;font-weight:600}
.knob .kdesc{grid-column:1 / -1;font-size:11.5px;color:var(--ink2)}
.savebar{display:flex;gap:10px;align-items:center}

/* 連線 */
.setup{max-width:560px}
.setup label{display:block;font-size:11.5px;font-weight:600;color:var(--ink2);margin:12px 0 5px}
.setup input{width:100%}
.setup ol{font-size:12.5px;color:var(--ink2);padding-left:1.4em;margin:6px 0 0}
.setup ol li{margin:3px 0}

.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);
	background:#161b26;color:#fff;border-radius:8px;padding:9px 18px;
	font-size:12.5px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:9}
.toast.show{opacity:.95}

@media (max-width:760px){
	.shell{flex-direction:column;height:auto;overflow:visible}
	.side{width:100%;flex-direction:row;align-items:center;padding:10px 12px;gap:10px}
	.brand{padding:0 4px}
	.brand .sub{display:none}
	.nav{flex-direction:row;overflow-x:auto}
	.nav-item{width:auto;white-space:nowrap;padding:7px 10px}
	.side-foot{display:none}
	.knob{grid-template-columns:1fr}
	.hrow .meta{text-align:left}
}
</style>
</head>
<body>
<div class="shell">
	<aside class="side">
		<div class="brand" id="brand">
			<span class="name">journal</span>
		</div>
		<nav class="nav" id="nav"></nav>
		<div class="side-foot">
			<span class="row" id="freshness"></span>
			<span class="repo" id="repoChip">未連線</span>
		</div>
	</aside>
	<div class="main">
		<header class="topbar">
			<h1 id="pageTitle">journal 控制台</h1>
			<span class="sub" id="pageSub"></span>
			<span class="acts">
				<button class="btn" id="btnRefresh" title="重新拉取">更新</button>
			</span>
		</header>
		<main class="content" id="view"><div class="loading"><span class="spin"></span>載入中…</div></main>
	</div>
</div>
<div class="toast" id="toast"></div>

<script>
'use strict';
/* ════════════════════════════════════════════════════════════════
   journal 控制台 —— 零後端：瀏覽器直連 GitHub API（O9 拍板 2026-07-30）。
   讀 = contents API 拉 journal-data 即時渲染；寫 = PUT config.yml（一個
   commit），各機下一輪 pull 生效。PAT 只存 localStorage，不出這台瀏覽器。
   UI 語言對齊 taskwire 控制台設計稿（2026-08-28 拍板，2026-08-31 跟進）。
   ════════════════════════════════════════════════════════════════ */

const LS = { pat:'jc.pat', owner:'jc.owner', repo:'jc.repo', branch:'jc.branch', axis:'jc.axis' };
const S = {
	pat: localStorage.getItem(LS.pat) || '',
	owner: localStorage.getItem(LS.owner) || 'MiskaWu',
	repo: localStorage.getItem(LS.repo) || 'journal-data',
	branch: localStorage.getItem(LS.branch) || 'main',
	axis: localStorage.getItem(LS.axis) || 'project',
	config: { raw:'', sha:'' },
	goalDefs: [], statuses: [], hosts: [], dailies: [], weeklies: [],
	loadedAt: null, tab: 'overview', currentDate: null, traceGoal: '',
};

/* ─── GitHub API ─────────────────────────────────────────────── */
class AuthErr extends Error {}
async function gh(path, opts = {}) {
	const r = await fetch(`https://api.github.com/repos/${S.owner}/${S.repo}/${path}`, {
		method: opts.method || 'GET',
		headers: {
			'Authorization': `Bearer ${S.pat}`,
			'Accept': opts.raw ? 'application/vnd.github.raw+json' : 'application/vnd.github+json',
			'X-GitHub-Api-Version': '2022-11-28',
			...(opts.body ? { 'Content-Type': 'application/json' } : {}),
		},
		body: opts.body ? JSON.stringify(opts.body) : undefined,
	});
	if (r.status === 401 || r.status === 403) throw new AuthErr(`GitHub 拒絕（${r.status}）—— PAT 過期或權限不足`);
	if (r.status === 404 && opts.soft) return null;
	if (!r.ok) throw new Error(`${r.status} ${path}`);
	return opts.raw ? r.text() : r.json();
}
const ghRaw = (p) => gh(`contents/${p}?ref=${S.branch}`, { raw:true, soft:true });
const ghDir = (p) => gh(`contents/${p}?ref=${S.branch}`, { soft:true });

function b64utf8(s) {
	const b = new TextEncoder().encode(s);
	let out = '';
	for (let i = 0; i < b.length; i += 0x8000)
		out += String.fromCharCode.apply(null, b.subarray(i, i + 0x8000));
	return btoa(out);
}

/* ─── 剖析器（與 shell 端同一套子集）───────────────────────── */
function esc(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function inline(s) {
	let o = esc(s);
	o = o.replace(/`([^`]+)`/g, (_, c) => `<code>${c}</code>`);
	o = o.replace(/(^|[（(、\s])([0-9a-f]{7,10})(?=[）)、\s]|$)/g, (_, p, h) => `${p}<code class="hash">${h}</code>`);
	return o;
}
function yGet(raw, key, dflt = '') {
	const m = raw.match(new RegExp(`^${key}:[ \\t]*"?([^"#\\n]*?)"?[ \\t]*(?:#.*)?$`, 'm'));
	return m ? m[1].trim() : dflt;
}
function ySet(raw, key, val) {
	const re = new RegExp(`^${key}:.*$`, 'm');
	const line = `${key}: ${/[:#]|^$|\s/.test(String(val)) ? `"${val}"` : val}`;
	return re.test(raw) ? raw.replace(re, line) : raw.replace(/\s*$/, `\n${line}\n`);
}
function parseDaily(raw) {
	const m = raw.match(/^\s*---\n([\s\S]*?)\n---\n([\s\S]*)$/);
	if (!m) return null;
	const fm = {};
	m[1].split('\n').forEach(l => { const i = l.indexOf(':'); if (i > 0) fm[l.slice(0,i).trim()] = l.slice(i+1).trim(); });
	const sections = {}; let cur = null;
	m[2].split('\n').forEach(l => {
		const h = l.match(/^##\s+(.+?)\s*$/);
		if (h) { cur = h[1]; sections[cur] = []; return; }
		const li = l.match(/^-\s+(.*)$/);
		if (li && cur) sections[cur].push(li[1]);
	});
	const brief = (sections['摘要'] || []).map(r => {
		const p = r.split('|');
		if (p.length < 4) return { project:'—', kind:'其他', tags:[], text:r.trim() };
		return { project:p[0].trim()||'—', kind:p[1].trim()||'其他',
			tags:p[2].split(',').map(t=>t.trim()).filter(Boolean), text:p.slice(3).join('|').trim() };
	});
	const mm = (fm.metrics||'').match(/sessions:\s*(\d+).*commits:\s*(\d+).*files_touched:\s*(\d+)/);
	return {
		date: fm.date, host: fm.host, status: fm.status || 'ok',
		goals: (fm.goals_touched||'').replace(/[\[\]]/g,'').split(',').map(g=>g.trim()).filter(Boolean),
		metrics: mm ? { sessions:+mm[1], commits:+mm[2], files:+mm[3] } : { sessions:0, commits:0, files:0 },
		standup: sections['早會'] || [], brief, sections,
		reducer: fm.reduced_by || '?', generatedAt: fm.generated_at || '',
	};
}
function parseStatus(raw) {
	const host = yGet(raw, 'host'), ts = yGet(raw, 'checked_at');
	const results = [];
	for (const l of raw.split('\n')) {
		const m = l.match(/^  ([A-Za-z0-9_-]+): \{ state: ([a-z]+), kind: ([a-z?]+)(?:, detail: "([^"]*)")?/);
		if (m) results.push({ host, ts, id:m[1], state:m[2], kind:m[3], detail:m[4]||'' });
	}
	return results;
}
function parseHost(raw) {
	return { host:yGet(raw,'host'), roles:yGet(raw,'roles','[node]'),
		health:yGet(raw,'agent_health','?'), reason:yGet(raw,'degraded_reason'),
		lastSeen:yGet(raw,'last_seen'), retired:yGet(raw,'retired') };
}
function parseGoalDefs(raw) {
	const out = []; let cur = null; let inc = false;
	for (const l of (raw||'').split('\n')) {
		if (l.includes('<!--')) inc = true;
		if (inc) { if (l.includes('-->')) inc = false; continue; }
		const id = l.match(/^-\s+id:\s*(\S+)/);
		if (id) { cur = { id:id[1], title:'', done:'' }; out.push(cur); continue; }
		if (!cur) continue;
		if (/^\S/.test(l)) { cur = null; continue; }
		const t = l.match(/^\s+title:\s*(.+)$/); if (t) cur.title = t[1].trim();
		const d = l.match(/^\s+done-when:\s*(.+)$/); if (d) cur.done = d[1].trim();
	}
	return out;
}

/* ─── 聚合邏輯（與 lib/aggregate.sh 同一套規則）──────────────── */
function goalWinners() {
	const best = {}, naD = {}, seen = new Set();
	for (const r of S.statuses) {
		seen.add(r.id);
		if (r.state === 'na') { if (!(r.id in naD)) naD[r.id] = r.detail; continue; }
		if (!best[r.id] || r.ts > best[r.id].ts) best[r.id] = r;
	}
	return [...seen].sort().map(id => best[id] ||
		({ id, state:'unchecked', detail:`全部 host 皆 na（${naD[id]||''}）`, host:'-', ts:'-' }));
}
function daysBetween(d1, d2) {
	return Math.round((new Date(d2+'T12:00') - new Date(d1+'T12:00')) / 86400000);
}
function buildAlerts() {
	const today = new Date().toISOString().slice(0,10);
	const stale = +yGet(S.config.raw, 'stale_days', '3');
	const gStale = +yGet(S.config.raw, 'goal_stale_days', '7');
	const out = [];
	for (const h of S.hosts) {
		if (h.retired) continue;
		const seen = (h.lastSeen||'').slice(0,10);
		if (seen) {
			const gap = daysBetween(seen, today);
			if (gap > stale) out.push({ sev:'bad', tag:'沉默', text:`${h.host} 沉默 ${gap} 天（last_seen ${seen}）—— 機器關著？agent 死了？` });
		}
		if (h.health === 'fail') out.push({ sev:'bad', tag:'紅燈', text:`${h.host} 不健康：${h.reason||'無原因'}` });
		if (h.health === 'degraded') out.push({ sev:'warn', tag:'降級', text:`${h.host} 降級運行：${h.reason||''}` });
	}
	const lastTouched = {};
	for (const d of S.dailies) for (const g of d.goals)
		if (!lastTouched[g] || d.date > lastTouched[g]) lastTouched[g] = d.date;
	for (const w of goalWinners()) {
		if (w.state === 'fail') out.push({ sev:'bad', tag:'紅燈', text:`目標 ${w.id} fail：${w.detail}（${w.host} 量測）` });
		if (w.state === 'pass' || w.state === 'manual') continue;
		const lt = lastTouched[w.id];
		if (lt && daysBetween(lt, today) > gStale)
			out.push({ sev:'warn', tag:'停滯', text:`目標 ${w.id} 已 ${daysBetween(lt, today)} 天沒動（最後出現 ${lt}）` });
	}
	return out;
}

/* ─── 載入 ───────────────────────────────────────────────────── */
async function loadAll() {
	view(`<div class="loading"><span class="spin"></span>從 GitHub 拉取中…</div>`);
	const cfgMeta = await gh(`contents/config.yml?ref=${S.branch}`);
	S.config = { raw: new TextDecoder().decode(Uint8Array.from(atob(cfgMeta.content.replace(/\n/g,'')), c=>c.charCodeAt(0))), sha: cfgMeta.sha };
	const [goalsRaw, stDir, hoDir, daDir, wkDir] = await Promise.all([
		ghRaw('GOALS.md'), ghDir('status'), ghDir('hosts'), ghDir('daily'), ghDir('weekly')]);
	S.goalDefs = parseGoalDefs(goalsRaw || '');
	const yml = f => f.name.endsWith('.yml');
	S.statuses = (await Promise.all((stDir||[]).filter(yml).map(f => ghRaw(`status/${f.name}`))))
		.filter(Boolean).flatMap(parseStatus);
	S.hosts = (await Promise.all((hoDir||[]).filter(yml).map(f => ghRaw(`hosts/${f.name}`))))
		.filter(Boolean).map(parseHost);
	const dailyFiles = (daDir||[]).filter(f => f.name.endsWith('.md')).map(f => f.name)
		.sort().reverse().slice(0, 40);
	S.dailies = (await Promise.all(dailyFiles.map(n => ghRaw(`daily/${n}`))))
		.filter(Boolean).map(parseDaily).filter(Boolean)
		.sort((a,b) => a.date < b.date ? 1 : -1);
	S.weeklies = await Promise.all(((wkDir||[]).filter(f => f.name.endsWith('.md')).map(f => f.name)
		.sort().reverse().slice(0, 12)).map(async n => ({ name:n.replace('.md',''), raw: await ghRaw(`weekly/${n}`) })));
	S.loadedAt = new Date();
	document.getElementById('repoChip').textContent = `${S.owner}/${S.repo}@${S.branch}`;
	document.getElementById('freshness').textContent = `拉取於 ${S.loadedAt.toTimeString().slice(0,5)}`;
}

/* ─── UI 基礎 ────────────────────────────────────────────────── */
const $view = document.getElementById('view');
function view(html) { $view.innerHTML = html; }
function toast(msg) {
	const t = document.getElementById('toast');
	t.textContent = msg; t.classList.add('show');
	setTimeout(() => t.classList.remove('show'), 2600);
}
/* SVG stroke 圖示（24 viewBox、1.8 stroke），與 taskwire 同語言 */
const ICONS = {
	gauge:'<path d="M12 14l3.5-4.5"/><path d="M20.2 16a8.5 8.5 0 1 0-16.4 0"/>',
	file:'<path d="M6 3.5h8l4 4v13H6z"/><path d="M14 3.5v4h4M9 12h6M9 15.5h6"/>',
	board:'<path d="M5 4.5v15M12 4.5v10M19 4.5v6"/>',
	calendar:'<rect x="3.5" y="5" width="17" height="15.5" rx="1.5"/><path d="M3.5 9.5h17M8 3v4M16 3v4"/>',
	sliders:'<path d="M4 7h9M17 7h3M4 12h3M11 12h9M4 17h9M17 17h3"/><circle cx="15" cy="7" r="2"/><circle cx="9" cy="12" r="2"/><circle cx="15" cy="17" r="2"/>',
	plug:'<path d="M9 3.5V7M15 3.5V7"/><path d="M6.5 7h11v3.5a5.5 5.5 0 0 1-11 0z"/><path d="M12 16v4.5"/>',
	book:'<path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H20v15.5H6.5A2.5 2.5 0 0 0 4 21z"/><path d="M4 18.5A2.5 2.5 0 0 1 6.5 16H20"/>',
};
const icon = (n, s=18) => `<svg viewBox="0 0 24 24" width="${s}" height="${s}" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${ICONS[n]||''}</svg>`;
const TABS = [
	['overview','總攬','gauge','警報、目標與機器一眼看完'],
	['daily','日誌','file','每天的早會、摘要與細節'],
	['trace','軌跡','board','單一目標的推進線'],
	['weekly','週報','calendar','aggregator 生成的每週 digest'],
	['knobs','旋鈕','sliders','改 config.yml，各機下一輪 pull 生效'],
	['setup','連線','plug','GitHub PAT 與資料 repo'],
];
document.getElementById('brand').insertAdjacentHTML('afterbegin', icon('book', 20));
function renderNav() {
	document.getElementById('nav').innerHTML = TABS.map(([k,l,ic]) =>
		`<button class="nav-item ${S.tab===k?'on':''}" data-tab="${k}">${icon(ic)}${l}</button>`).join('');
	const t = TABS.find(x => x[0] === S.tab);
	document.getElementById('pageTitle').textContent = t[1];
	document.getElementById('pageSub').textContent = t[3];
}
document.getElementById('nav').addEventListener('click', e => {
	const b = e.target.closest('button'); if (!b) return;
	S.tab = b.dataset.tab; renderNav(); render();
});
document.getElementById('btnRefresh').addEventListener('click', async () => {
	try { await loadAll(); render(); toast('已更新'); }
	catch (e) { handleErr(e, true); }
});
/* 失敗永遠長成紅框，絕不渲染成空清單——「查不到」和「沒有」必須分得出來 */
function errBox(e, title = '查詢失敗') {
	return `<div class="err"><strong>${esc(title)}</strong><pre>${esc(e.message)}</pre></div>`;
}
function handleErr(e, inView = false) {
	if (e instanceof AuthErr) { S.tab = 'setup'; renderNav(); render(); toast(e.message); }
	else if (inView) { view(errBox(e)); console.error(e); }
	else { toast(`錯誤：${e.message}`); console.error(e); }
}

/* ─── 分頁：總攬 ─────────────────────────────────────────────── */
const STATE_BADGE = { pass:'ok', partial:'warn', fail:'bad', manual:'accent', unchecked:'idle' };
function vOverview() {
	const alerts = buildAlerts();
	const winners = goalWinners();
	const defs = Object.fromEntries(S.goalDefs.map(g => [g.id, g]));
	let h = `<div class="card"><div class="card-head"><div class="t">需要注意</div></div>`;
	h += alerts.length
		? alerts.map(a => `<div class="arow"><span class="badge b-${a.sev}">${esc(a.tag)}</span><span>${esc(a.text)}</span></div>`).join('')
		: '<div class="okmsg">都好，沒有紅燈。</div>';
	h += '</div>';

	h += `<div class="card-head" style="margin:4px 0 -6px"><div class="t">目標</div></div><div class="gtiles">`;
	for (const w of winners) {
		const d = defs[w.id] || {};
		h += `<div class="tile"><div class="lab"><span class="id">${esc(w.id)}</span>
			<span class="badge b-${STATE_BADGE[w.state]||'idle'}">${esc(w.state)}</span></div>
			${d.title ? `<div class="ttl">${esc(d.title)}</div>` : ''}
			<div class="meta">${esc(w.detail||'-')}<br>${esc(w.host)} · ${esc(String(w.ts).slice(0,16))}</div></div>`;
	}
	h += '</div>';

	h += `<div class="card"><div class="card-head"><div class="t">機器</div></div>`;
	for (const x of S.hosts) {
		const c = x.retired ? '#8892a0' : x.health==='ok' ? 'var(--ok)' : x.health==='degraded' ? '#c98a00' : 'var(--bad)';
		h += `<div class="hrow"><span class="dot" style="background:${c}"></span>
			<span><span class="nm">${esc(x.host)}</span> <span class="muted">${esc(x.roles)}${x.retired?' · retired':''}</span></span>
			<span class="meta">${esc((x.lastSeen||'').slice(0,16))}</span></div>`;
	}
	h += '</div>';

	const latest = S.dailies[0];
	if (latest) {
		h += `<div class="card"><div class="card-head"><div><div class="t">最新早會</div>
			<div class="s mono">${esc(latest.date)} · ${esc(latest.host)}</div></div></div>${standupHtml(latest)}</div>`;
	}
	view(h);
}
function standupHtml(d) {
	if (!d.standup.length) return '<p class="empty">（無早會段）</p>';
	return `<div class="standup">` + d.standup.map(l => {
		const red = /^紅燈[：:]/.test(l);
		return `<p${red?' class="red"':''}>${red?'<span class="dot" style="background:var(--bad)"></span>':''}${inline(l)}</p>`;
	}).join('') + '</div>';
}

/* ─── 分頁：日誌（三層瀏覽）──────────────────────────────────── */
const KINDS = ['功能','修復','進度','拍板','卡住'];
const KIND_BADGE = { '功能':'ok', '修復':'accent', '進度':'warn', '拍板':'idle', '卡住':'bad', '其他':'idle' };
const kindBadge = k => `<span class="badge b-${KIND_BADGE[k]||'idle'}">${esc(k)}</span>`;
function vDaily() {
	if (!S.dailies.length) return view('<p class="empty">還沒有 daily。</p>');
	if (!S.currentDate) S.currentDate = S.dailies[0].date;
	const dates = [...new Set(S.dailies.map(d => d.date))];
	let h = `<div class="daynav">` + dates.map(dt =>
		`<button data-date="${dt}" class="${dt===S.currentDate?'on':''}">${dt.slice(5).replace('-','.')}</button>`).join('') + '</div>';
	for (const d of S.dailies.filter(x => x.date === S.currentDate)) {
		h += `<div class="card"><div class="card-head"><div><div class="t">${esc(d.date)} · ${esc(d.host)}</div>
			<div class="s mono">${d.metrics.sessions} sessions · ${d.metrics.commits} commits</div></div></div>`;
		if (d.status === 'no-material') { h += '<p class="empty">這天沒有素材。</p></div>'; continue; }
		h += standupHtml(d);
		h += briefHtml(d);
		h += detailsHtml(d);
		h += '</div>';
	}
	view(h);
	$view.querySelectorAll('.daynav button').forEach(b =>
		b.addEventListener('click', () => { S.currentDate = b.dataset.date; vDaily(); }));
	$view.querySelectorAll('.seg button').forEach(b =>
		b.addEventListener('click', () => {
			S.axis = b.dataset.axis; localStorage.setItem(LS.axis, S.axis); vDaily();
		}));
}
function briefHtml(d) {
	if (!d.brief.length) return '';
	const AXES = [['project','專案'],['kind','類型'],['tag','標籤']];
	let h = `<div class="card-head" style="margin:16px 0 4px"><div class="t">摘要</div>
		<div class="right"><div class="seg">` +
		AXES.map(([k,l]) => `<button data-axis="${k}" class="${S.axis===k?'on':''}">${l}</button>`).join('') +
		'</div></div></div>';
	const groups = new Map();
	const put = (k, it) => { if (!groups.has(k)) groups.set(k, []); groups.get(k).push(it); };
	for (const it of d.brief) {
		if (S.axis === 'project') put(it.project, it);
		else if (S.axis === 'kind') put(it.kind, it);
		else it.tags.length ? it.tags.forEach(t => put('#'+t, it)) : put('（無標籤）', it);
	}
	const keys = [...groups.keys()];
	if (S.axis === 'kind') keys.sort((a,b) => (KINDS.indexOf(a)+99)%100 - (KINDS.indexOf(b)+99)%100);
	else keys.sort((a,b) => (groups.get(a).every(i=>i.kind==='卡住')?1:0) - (groups.get(b).every(i=>i.kind==='卡住')?1:0));
	for (const k of keys) {
		h += `<div class="ghead">${esc(k)} <span class="cnt">${groups.get(k).length}</span></div>`;
		for (const it of groups.get(k)) {
			h += `<div class="lrow">${kindBadge(KINDS.includes(it.kind)?it.kind:'其他')}<span>` +
				(S.axis !== 'project' && it.project !== '—' ? `<span class="who">${esc(it.project)}</span> · ` : '') +
				inline(it.text) + '</span></div>';
		}
	}
	return h;
}
function detailsHtml(d) {
	const SEC = [['完成','ok'],['拍板','accent'],['待續','warn'],['卡住','bad']];
	const counts = SEC.map(([k]) => `${k} ${(d.sections[k]||[]).length}`).join(' · ');
	let h = `<details class="raw" style="margin-top:16px"><summary>細節 — ${counts}</summary>`;
	for (const [k, b] of SEC) {
		const items = d.sections[k] || [];
		h += `<div class="ghead"><span class="badge b-${b}">${k}</span><span class="cnt">${items.length}</span></div>`;
		h += items.length
			? items.map(i => `<div class="lrow"><span>${inline(i)}</span></div>`).join('')
			: '<p class="empty">—</p>';
	}
	return h + '</details>';
}

/* ─── 分頁：軌跡 ─────────────────────────────────────────────── */
function vTrace() {
	const all = new Set(S.goalDefs.map(g => g.id));
	for (const d of S.dailies) for (const g of d.goals) all.add(g);
	const goals = [...all].sort();
	if (!S.traceGoal && goals.length) S.traceGoal = goals[0];
	let h = `<div class="card"><div class="card-head"><div class="t">目標推進線</div>
		<div class="right"><select id="traceSel">${goals.map(g =>
			`<option ${g===S.traceGoal?'selected':''}>${esc(g)}</option>`).join('')}</select></div></div>
		<p class="muted" style="margin:0 0 6px">靠 goals_touched 推斷串線 —— 導覽用，不是證據</p>`;
	const hits = S.dailies.filter(d => d.goals.includes(S.traceGoal)).sort((a,b)=>a.date<b.date?1:-1);
	if (!hits.length) h += '<p class="empty">沒有任何 daily 標記過這個目標。</p>';
	for (const d of hits) {
		const items = d.brief.filter(b => b.project.includes(S.traceGoal) || b.tags.some(t => t.includes(S.traceGoal)));
		h += `<div class="ghead"><span class="mono" style="font-size:11.5px;color:var(--ink2)">${esc(d.date)}</span><span class="cnt">${esc(d.host)}</span></div>`;
		h += (items.length ? items : d.brief.slice(0,1)).map(b =>
			`<div class="lrow">${kindBadge(KINDS.includes(b.kind)?b.kind:'其他')}<span>${inline(b.text)}</span></div>`).join('');
	}
	view(h + '</div>');
	document.getElementById('traceSel').addEventListener('change', e => { S.traceGoal = e.target.value; vTrace(); });
}

/* ─── 分頁：週報 ─────────────────────────────────────────────── */
function vWeekly() {
	if (!S.weeklies.length) return view('<p class="empty">還沒有週報 —— aggregator 上跑 <code>journal digest</code> 生成。</p>');
	let h = '';
	for (const w of S.weeklies) {
		const body = (w.raw || '').replace(/^\s*---[\s\S]*?---\n/, '');
		h += `<div class="card"><div class="card-head"><div class="t mono">${esc(w.name)}</div></div>` +
			body.split('\n').map(l => {
				if (/^##\s/.test(l)) return `<div class="ghead">${esc(l.replace(/^##\s*/,''))}</div>`;
				if (/^-\s/.test(l)) return `<div class="lrow"><span>${inline(l.slice(2))}</span></div>`;
				return l.trim() ? `<div class="lrow"><span>${inline(l)}</span></div>` : '';
			}).join('') + '</div>';
	}
	view(h);
}

/* ─── 分頁：旋鈕（寫入！）────────────────────────────────────── */
const KNOBS = [
	{ key:'standup_lines',  type:'range', min:1, max:10, label:'早會力度',
	  desc:'站立會議短句最多幾行。改完下一次 rollup 生效；舊日子重跑 rollup 套用。' },
	{ key:'model_rollup',   type:'text', label:'L2 夜間模型', placeholder:'（該機預設）',
	  desc:'一天一次、整併全天素材 —— 品質優先。別名（opus/sonnet/haiku）或完整型號。' },
	{ key:'model_capture',  type:'text', label:'L1 即時模型', placeholder:'（該機預設）',
	  desc:'每關一個 session 跑一次 —— 便宜模型很合理（如 haiku）。' },
	{ key:'model_check',    type:'text', label:'SLI judge 模型', placeholder:'（該機預設）',
	  desc:'只有 judge 型 SLI 會用到。' },
	{ key:'rollup_time',    type:'time', label:'夜間整併時間',
	  desc:'挑「通常還開著機」的時段。改了要在各機重跑 journal init 讓 timer 重寫。' },
	{ key:'aggregate_time', type:'time', label:'聚合時間',
	  desc:'aggregator 合成 progress 的時間，排在 rollup 之後。改了 aggregator 重跑 init。' },
	{ key:'stale_days',     type:'number', min:1, max:30, label:'機器沉默門檻（天）',
	  desc:'超過幾天沒回報算沉默警報。' },
	{ key:'goal_stale_days',type:'number', min:1, max:60, label:'目標停滯門檻（天）',
	  desc:'目標幾天沒出現在 daily 算停滯。' },
];
function vKnobs() {
	let h = `<div class="card"><div class="card-head"><div><div class="t">旋鈕</div>
		<div class="s">改完按儲存 = 直接 commit 到 config.yml，各機下一輪 pull 生效</div></div></div>`;
	for (const k of KNOBS) {
		const v = yGet(S.config.raw, k.key, '');
		h += `<div class="knob"><span class="kname">${k.key}</span><span>`;
		if (k.type === 'range')
			h += `<input type="range" min="${k.min}" max="${k.max}" value="${esc(v||'3')}" data-knob="${k.key}"
				oninput="this.nextElementSibling.textContent=this.value">
				<b class="mono" style="margin-left:8px">${esc(v||'3')}</b>`;
		else if (k.type === 'time')
			h += `<input type="time" value="${esc(v)}" data-knob="${k.key}" style="width:130px">`;
		else if (k.type === 'number')
			h += `<input type="number" min="${k.min}" max="${k.max}" value="${esc(v)}" data-knob="${k.key}" style="width:90px">`;
		else
			h += `<input type="text" value="${esc(v)}" placeholder="${esc(k.placeholder||'')}" data-knob="${k.key}" list="models" style="width:230px">`;
		h += `</span><span class="kdesc">${esc(k.label)} —— ${esc(k.desc)}</span></div>`;
	}
	h += `</div>
	<datalist id="models"><option value="haiku"><option value="sonnet"><option value="opus"><option value="fable"></datalist>
	<div class="savebar">
		<button class="btn primary" id="btnSave">儲存（commit）</button>
		<span class="muted" id="saveHint"></span>
	</div>`;
	view(h);
	document.getElementById('btnSave').addEventListener('click', saveKnobs);
}
async function saveKnobs() {
	const btn = document.getElementById('btnSave');
	const changes = {};
	$view.querySelectorAll('[data-knob]').forEach(el => {
		const cur = yGet(S.config.raw, el.dataset.knob, '');
		if (String(el.value) !== String(cur)) changes[el.dataset.knob] = el.value;
	});
	if (!Object.keys(changes).length) return toast('沒有變更');
	btn.disabled = true;
	try {
		let raw = S.config.raw;
		for (const [k, v] of Object.entries(changes)) raw = ySet(raw, k, v);
		const res = await gh('contents/config.yml', { method:'PUT', body:{
			message:`web: 調整 ${Object.keys(changes).join(', ')}`,
			content: b64utf8(raw), sha: S.config.sha, branch: S.branch } });
		S.config = { raw, sha: res.content.sha };
		toast(`已 commit ${res.commit.sha.slice(0,7)} —— 各機下一輪 pull 生效`);
		document.getElementById('saveHint').textContent =
			Object.keys(changes).some(k => k.endsWith('_time'))
				? '注意：改了時間類旋鈕，要在對應機器重跑 journal init 讓 timer 重寫'
				: '';
	} catch (e) { handleErr(e); }
	btn.disabled = false;
}

/* ─── 分頁：連線設定 ─────────────────────────────────────────── */
function vSetup() {
	view(`<div class="setup card">
	<div class="card-head"><div class="t">連線 GitHub</div></div>
	<ol>
		<li>到 <a href="https://github.com/settings/personal-access-tokens/new" target="_blank" rel="noopener">建 fine-grained PAT</a></li>
		<li>Repository access → <b>Only select repositories</b> → 只勾 <code>journal-data</code></li>
		<li>Permissions → <b>Contents: Read and write</b>（其餘都不用）</li>
		<li>貼進來。PAT 只存這個瀏覽器的 localStorage，不會被送到 GitHub 以外的任何地方。</li>
	</ol>
	<label>Owner / Repo / Branch</label>
	<div style="display:flex;gap:8px">
		<input id="inOwner" value="${esc(S.owner)}" style="flex:1">
		<input id="inRepo" value="${esc(S.repo)}" style="flex:1">
		<input id="inBranch" value="${esc(S.branch)}" style="width:90px">
	</div>
	<label>Fine-grained PAT</label>
	<input id="inPat" type="password" value="${esc(S.pat)}" placeholder="github_pat_…">
	<div class="savebar" style="margin-top:14px">
		<button class="btn primary" id="btnConnect">連線並載入</button>
		<button class="btn danger" id="btnForget">清除本機 PAT</button>
	</div></div>`);
	document.getElementById('btnConnect').addEventListener('click', async () => {
		S.owner = document.getElementById('inOwner').value.trim();
		S.repo = document.getElementById('inRepo').value.trim();
		S.branch = document.getElementById('inBranch').value.trim() || 'main';
		S.pat = document.getElementById('inPat').value.trim();
		localStorage.setItem(LS.owner, S.owner); localStorage.setItem(LS.repo, S.repo);
		localStorage.setItem(LS.branch, S.branch); localStorage.setItem(LS.pat, S.pat);
		try { await loadAll(); S.tab = 'overview'; renderNav(); render(); toast('連上了'); }
		catch (e) { handleErr(e, true); }
	});
	document.getElementById('btnForget').addEventListener('click', () => {
		localStorage.removeItem(LS.pat); S.pat = ''; toast('已清除'); vSetup();
	});
}

/* ─── 路由 ───────────────────────────────────────────────────── */
function render() {
	({ overview:vOverview, daily:vDaily, trace:vTrace,
	   weekly:vWeekly, knobs:vKnobs, setup:vSetup })[S.tab]();
}
renderNav();
(async () => {
	if (!S.pat) { S.tab = 'setup'; renderNav(); return render(); }
	try { await loadAll(); render(); }
	catch (e) { handleErr(e, true); }
})();
</script>
</body>
</html>
