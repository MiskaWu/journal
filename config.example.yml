# journal 資料 repo 的設定檔 —— 複製成 journal-data/config.yml
#
# ⚠ 這不是完整 YAML。journal 只吃一個扁平子集（DESIGN §9：「格式是我們自己定的，
#   定成扁平好剖析」），所以：
#     · 頂層 key 必須頂格，`key: value`
#     · 清單就是底下縮排的 `  - item`
#     · 對映就是底下縮排的 `  sub: value`
#   不支援錨點、多行字串、巢狀兩層以上。要放進來的東西請保持扁平。

timezone: Asia/Taipei

# 指定聚合者（P5 才會用到）。同時只能有一台，且不該是 WSL2 上的開發機。
aggregator: ""

# ---------------------------------------------------------------- git 素材
#
# 不填也能跑：當日 transcript 出現過的 cwd 會自動推出所屬 repo。
# 這裡是「即使那天沒在裡面開 session 也要掃」的 repo。
repos:
  # - ~/projects/journal
  # - /opt/infra

# 算成「你」的 commit 作者。留空就用各 repo 自己的 git config user.email。
# 不篩的話，一次 rebase 或 pull 就會把別人的 commit 灌進你的當天。
git_authors:
  # - miskawu@gmail.com

# ---------------------------------------------------------------- slug 映射
#
# 同一個邏輯 repo 會有多個 slug —— 本機實測 14 個，dev-env-ansible 就散成
# 本體加四個 `--claude-worktrees-*`。不映射的話同一件事會被當成四個專案。
# 預設會由 cwd 推 git toplevel，通常已經對；這裡只放推不出來的例外。
slug_map:
  # -opt-infra: infra
  # -home-miskawu-infra: infra

# ---------------------------------------------------------------- 機密 gate
#
# 這個檔裡的**值**會被當字面字串掃描並 redact。檔不存在就靜靜跳過。
secrets_file: /opt/infra/secrets.yml

# 額外的 redact pattern（ERE）。內建已涵蓋 glpat- / gh?_ / AKIA / sk- / xox /
# AIza / JWT / PEM 標頭 / 48+ 位 hex。
#
# ⚠ 長 hex 門檻刻意設在 48 而不是 40：SHA-1 commit hash 正好 40 個 hex，
#   設 40 會把每一個 commit 參照都洗成 «REDACTED»。
redact_patterns:
  # - mycorp_[A-Za-z0-9]{24,}

# ---------------------------------------------------------------- 生成
claude_timeout: 300

# 蒸餾用的模型（claude -p --model 的值：別名如 haiku/sonnet/opus 或完整型號）。
# 留空 = 用該機 claude 的預設模型。這是「中心可控」的旋鈕（O9）：config.yml
# 在資料 repo 裡，各機 pull 之後下一次生成就換模型。
#
# 兩顆分開，因為成本結構不同：
#   capture 每關一個 session 跑一次（頻繁、素材小）→ 便宜模型很合理
#   rollup 一天一次、整併全天素材 → 品質優先
model_rollup: ""
model_capture: ""

# judge 型 SLI 用的模型（其餘 kind 不呼叫模型）。留空 = 該機預設。
model_check: ""

# 早會層的力度旋鈕：站立會議口吻的短句最多幾行（1–10）。
# 改了之後對「之後生成」的 daily 生效；舊的日子重跑 rollup 即套用。
standup_lines: 3

# L2 夜間整併的時間（HH:MM，本機時區）。挑「你通常還開著機」的時段而非深夜 ——
# WSL2 關機時 timer 不存在，錯過靠 Persistent=true 下次開機補跑。
# 改了要重跑 `journal init --local` 讓 timer 重寫。
rollup_time: "21:30"

# ---------------------------------------------------------------- 中心（P5）
# aggregator 合成 progress.md 的時間（要排在各機 rollup_time 之後）
aggregate_time: "22:15"

# 機器沉默幾天算 stale（⚫ 沉默 alert）
stale_days: 3

# 目標幾天沒在 daily 的 goals_touched 出現算沒動（🕳 goal staleness alert）
goal_stale_days: 7

# ---------------------------------------------------------------- 任務（docs/TASKS.md）
# now.md 三件全卡住（或 now 是空的）時，代理取件的行為：
#   idle    = 閒置等人清積壓（預設 —— 審查容量只有一個人，用閒置逼積壓浮上來）
#   backlog = 去待辦池撈 ready 的繼續產出（吞吐優先，審查佇列會繼續長）
task_stalled: idle

# 待審（review）達到這個數，代理停止認領新任務 —— 系統吞吐量等於人的審查容量
task_review_limit: 3

# doing 的認領心跳超過幾分鐘沒更新，視為死掉、放回 ready
task_lease_minutes: 60

# task list 把超過幾天沒動靜的任務標「老」（提醒歸系統，封存歸人）
task_stale_days: 7

# journal task new 預設的編號字首（<專案>-<序號>）
task_prefix: hy
